name: Testes do piloto ML espacial

on:
  push:
    paths:
      - "applications/ml_espacial/**"
      - ".github/workflows/ml-espacial.yml"
  pull_request:
    paths:
      - "applications/ml_espacial/**"
      - ".github/workflows/ml-espacial.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/ml_espacial

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: applications/ml_espacial/requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Executar testes
        run: python -m pytest -q
