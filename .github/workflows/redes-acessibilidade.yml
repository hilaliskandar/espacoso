name: Testes da aplicação A8 — redes, acessibilidade e fluxos territoriais

on:
  push:
    paths:
      - "applications/redes_acessibilidade/**"
      - ".github/workflows/redes-acessibilidade.yml"
  pull_request:
    paths:
      - "applications/redes_acessibilidade/**"
      - ".github/workflows/redes-acessibilidade.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/redes_acessibilidade

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: applications/redes_acessibilidade/requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Executar testes
        env:
          PYTHONPATH: src
        run: python -m pytest -q

      - name: Executar demonstração
        env:
          PYTHONPATH: src
        run: |
          python scripts/create_demo_data.py
          python -m redes_acessibilidade.run --config config/demo.yml
