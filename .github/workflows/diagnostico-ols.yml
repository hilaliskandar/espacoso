name: Testes da aplicação A3

on:
  push:
    paths:
      - "applications/diagnostico_ols/**"
      - ".github/workflows/diagnostico-ols.yml"
  pull_request:
    paths:
      - "applications/diagnostico_ols/**"
      - ".github/workflows/diagnostico-ols.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/diagnostico_ols
    env:
      MPLBACKEND: Agg

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: applications/diagnostico_ols/requirements.txt

      - name: Preparar ferramentas de construção
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Instalar dependências
        run: python -m pip install -e ".[dev]"

      - name: Executar testes
        run: python -m pytest -q

      - name: Executar demonstração
        run: |
          python scripts/create_demo_data.py --output-dir data/demo
          diagnostico-ols config/demo.yml
