name: Testes do template A11

on:
  push:
    paths:
      - "templates/projeto_aplicado/**"
      - ".github/workflows/projeto-aplicado.yml"
  pull_request:
    paths:
      - "templates/projeto_aplicado/**"
      - ".github/workflows/projeto-aplicado.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: templates/projeto_aplicado

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: templates/projeto_aplicado/requirements.txt

      - name: Preparar ferramentas de construção
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Instalar dependências
        run: python -m pip install -e . pytest

      - name: Executar testes
        run: python -m pytest -q
