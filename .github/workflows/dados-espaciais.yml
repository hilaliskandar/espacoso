name: Testes da aplicação A1 — dados espaciais

on:
  push:
    paths:
      - "applications/dados_espaciais/**"
      - ".github/workflows/dados-espaciais.yml"
  pull_request:
    paths:
      - "applications/dados_espaciais/**"
      - ".github/workflows/dados-espaciais.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/dados_espaciais

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: applications/dados_espaciais/requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Executar testes
        env:
          PYTHONPATH: src
        run: python -m pytest -q

      - name: Executar demonstração
        env:
          PYTHONPATH: src
        run: |
          python scripts/create_demo_data.py --output data/raw
          python -m dados_espaciais.run --config config/demo.yml
