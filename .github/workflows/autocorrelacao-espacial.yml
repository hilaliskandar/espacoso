name: Testes da aplicação A2

on:
  push:
    paths:
      - "applications/autocorrelacao_espacial/**"
      - ".github/workflows/autocorrelacao-espacial.yml"
  pull_request:
    paths:
      - "applications/autocorrelacao_espacial/**"
      - ".github/workflows/autocorrelacao-espacial.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/autocorrelacao_espacial

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: applications/autocorrelacao_espacial/requirements.txt

      - name: Preparar ferramentas de construção
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Instalar dependências
        run: python -m pip install -e . pytest

      - name: Executar testes
        run: python -m pytest -q
