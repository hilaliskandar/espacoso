[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "econometria-espacial"
version = "0.1.0"
description = "Econometria espacial de corte transversal: SAR, SEM, SLX, SDM e decomposição de impactos"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Espaçoso"}]
dependencies = [
  "geopandas>=1.0",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "scipy>=1.13",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
econometria-espacial = "econometria_espacial.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
