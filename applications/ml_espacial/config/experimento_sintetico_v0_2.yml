experiment:
  name: synthetic_spatial_nested_v0_2
  seed: 20260803
  output_dir: outputs/synthetic_v0_2

data:
  dataset: synthetic_spatial
  target: MedHouseVal
  coordinate_columns: [Longitude, Latitude]
  sample_limit: 240

validation:
  inner_splits: 2
  designs:
    - name: random
      kind: random
      n_splits: 3
    - name: spatial_fine
      kind: spatial
      n_splits: 3
      n_rows: 4
      n_cols: 4
      buffer_distance: 0.0
    - name: spatial_coarse_buffered
      kind: spatial
      n_splits: 3
      n_rows: 3
      n_cols: 3
      buffer_distance: 0.20

models:
  enabled: [M0, M1, M2U, M2D, M3]
  ridge:
    alpha_grid: [0.3, 1.0]
  random_forest:
    n_estimators_grid: [24]
    min_samples_leaf_grid: [2, 6]
    max_features_grid: [0.6, 1.0]
    n_jobs: -1
  lag_features:
    k_neighbors: 6
    distance_power: 1.0
  spatial_basis:
    n_components: 20
    gamma: 0.5

intervals:
  coverage: 0.90

diagnostics:
  moran:
    k: 6
    permutations: 39
  lisa:
    k: 6
    weighting: uniform
    permutations: 39
    alpha: 0.05
