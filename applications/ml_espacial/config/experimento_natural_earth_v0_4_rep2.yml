experiment:
  name: natural_earth_countries_real_v0_4
  seed: 20260803
  generate_maps: false
  output_dir: outputs/natural_earth_real_v0_4_rep2

data:
  dataset: local_csv
  path: data/processed/natural_earth_countries_v0_4.csv
  target: log_gdp_md_est
  coordinate_columns: [x_km, y_km]
  sample_limit: null

validation:
  repetitions: 1
  repetition_start: 2
  inner_splits: 2
  designs:
    - name: random
      kind: random
      n_splits: 3
    - name: spatial_fine
      kind: spatial
      n_splits: 3
      n_rows: 4
      n_cols: 4
      buffer_distance: 0.0
    - name: spatial_coarse_buffered
      kind: spatial
      n_splits: 3
      n_rows: 3
      n_cols: 3
      buffer_distance: 500.0

models:
  enabled: [M0, M1, M2U, M3]
  ridge:
    alpha_grid: [0.1, 1.0, 10.0]
  random_forest:
    n_estimators_grid: [100]
    min_samples_leaf_grid: [2, 5]
    max_features_grid: [0.7, 1.0]
    n_jobs: -1
  lag_features:
    k_neighbors: 5
    distance_power: 1.0
  spatial_basis:
    n_components: 16
    gamma: 0.45

intervals:
  coverage: 0.90

diagnostics:
  moran:
    k: 5
    permutations: 99
  lisa:
    k: 5
    weighting: uniform
    permutations: 99
    alpha: 0.05
