experiment:
  name: synthetic_repeated_v0_3
  seed: 20260803
  output_dir: outputs/synthetic_v0_3

data:
  dataset: synthetic_spatial
  target: MedHouseVal
  coordinate_columns: [Longitude, Latitude]
  sample_limit: 120

validation:
  repetitions: 2
  inner_splits: 2
  designs:
    - name: random
      kind: random
      n_splits: 2
    - name: spatial_fine
      kind: spatial
      n_splits: 2
      n_rows: 4
      n_cols: 4
      buffer_distance: 0.0

models:
  enabled: [M0, M2U, M3]
  ridge:
    alpha_grid: [0.1, 1.0]
  random_forest:
    n_estimators_grid: [80]
    min_samples_leaf_grid: [2, 5]
    max_features_grid: [0.8]
    n_jobs: -1
  lag_features:
    k_neighbors: 8
    distance_power: 1.0
  spatial_basis:
    n_components: 24
    gamma: 0.45

intervals:
  coverage: 0.90

diagnostics:
  moran:
    k: 6
    permutations: 19
  lisa:
    k: 6
    weighting: uniform
    permutations: 19
    alpha: 0.05
