experiment:
  name: synthetic_spatial_smoke_test
  seed: 20260803
  output_dir: outputs/synthetic_smoke
data:
  dataset: synthetic_spatial
  target: MedHouseVal
  coordinate_columns: [Longitude, Latitude]
  sample_limit: 400
validation:
  n_splits: 4
  random_shuffle: true
  spatial_grid_columns: 4
  spatial_grid_rows: 4
  moran_k: 6
  moran_permutations: 19
models:
  ridge:
    alpha: 1.0
  random_forest:
    n_estimators: 40
    min_samples_leaf: 4
    max_features: 0.7
    n_jobs: -1
  lag_features:
    k_neighbors: 6
  spatial_basis:
    n_components: 32
    gamma: 0.5
