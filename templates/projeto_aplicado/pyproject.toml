[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projeto-aplicado"
version = "0.1.0"
description = "Template reproduzível para o projeto aplicado do curso de Análise Territorial e Econometria Espacial"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Projeto Espaçoso"}]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "geopandas>=1.0",
  "shapely>=2.0",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
projeto-aplicado = "projeto_aplicado.run:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
